name: Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Install kubectl
        if: github.event_name != 'pull_request'
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set up kubeconfig
        if: github.event_name != 'pull_request'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify hearth MicroK8s connection
        if: github.event_name != 'pull_request'
        run: |
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Update image in deployment manifest
        if: github.event_name != 'pull_request'
        run: |
          export REGISTRY_URL=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          export IMAGE_TAG=${{ github.sha }}
          envsubst < k8s/deployment.yaml > k8s/deployment.yaml.updated
          mv k8s/deployment.yaml.updated k8s/deployment.yaml

      - name: Apply k8s manifests
        if: github.event_name != 'pull_request'
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Verify deployment
        if: github.event_name != 'pull_request'
        run: |
          kubectl rollout status deployment/altshare-ui --timeout=180s
          kubectl get pods -l app=altshare-ui
          kubectl get service altshare-ui
          kubectl get ingress altshare-ui-ingress
